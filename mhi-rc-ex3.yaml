# ─────────────────────────────────────────────────────────────────────────────
# MHI RC-EX3 ESPHome Integration
#
# Hardware wiring (4 wires into the RC-EX3 panel through-hole vias):
#   Panel VCC  → ESP32 3.3 V (use a 3.3 V buck converter, NOT a linear reg)
#   Panel GND  → ESP32 GND
#   Panel TX   → ESP32 GPIO11  (UART RX)
#   Panel RX   → ESP32 GPIO4   (UART TX)
#
# Serial parameters: 38400 baud, 8 data bits, Even parity, 1 stop bit (8E1)
# ─────────────────────────────────────────────────────────────────────────────

esphome:
  name: mhi-rc-ex3
  friendly_name: MHI RC-EX3

esp32:
  board: esp32-s2-saola-1
  framework:
    type: arduino

# ── Credentials ──────────────────────────────────────────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # ESPHome defaults this to "light" on ESP32, which enables WiFi modem sleep:
  # the radio only wakes at DTIM beacon intervals to collect buffered packets.
  # Anything the device sends is unaffected — it is awake when it transmits —
  # so status polls look perfectly healthy while inbound commands from Home
  # Assistant are delayed by seconds to minutes and are sometimes dropped
  # outright when the access point discards buffered frames.
  #
  # That asymmetry (outbound fine, inbound late and lossy, device otherwise
  # healthy) is exactly the symptom this device showed. Costs ~20-30 mA.
  power_save_mode: none

  ap:
    ssid: "MHI-RC-EX3 Fallback"
    password: !secret ap_password

captive_portal:

# ── Logging ──────────────────────────────────────────────────────────────────
logger:
  # Logging goes out over USB CDC on the S2, so it does not contend with the
  # RC-EX3 UART on GPIO11/GPIO4. Set level to DEBUG while commissioning, then
  # WARN in prod.
  #
  # To read these logs remotely, turn on "Subscribe to logs" in the ESPHome
  # integration's options in Home Assistant AND set the log level for
  # homeassistant.components.esphome to debug — both are required.
  #
  # DEBUG keeps the two lines worth having in normal running — `tx →` (INFO)
  # and `status:` (DEBUG) — while dropping the raw `rx:` frame dump, which is
  # VERBOSE and fires on every frame. Raise to VERBOSE only while debugging the
  # protocol: it costs ~14 kB of flash and a formatted serial write per frame.
  level: DEBUG

# ── Home Assistant API ───────────────────────────────────────────────────────
api:
  encryption:
    key: !secret api_encryption_key

# ── OTA ──────────────────────────────────────────────────────────────────────
ota:
  - platform: esphome
    password: !secret ota_password

# ── Time (for HA clock sync) ─────────────────────────────────────────────────
time:
  - platform: homeassistant
    id: ha_time

# ── External component (fetched from GitHub at compile time) ─────────────────
#
# `ref` MUST be a full commit SHA, never a branch name. ESPHome caches the
# clone under a key of url@ref and, on refresh, runs `git stash` + `git reset
# --hard` — so a branch ref means a rebuild silently picks up whatever that
# branch has become, while a SHA rebuilds byte-identically forever.
#
# The build fetches this repository from GitHub; it does not read the local
# components/ directory. Local edits have no effect on the device until they
# are committed, pushed, and this ref is bumped to the new commit.
external_components:
  - source:
      type: git
      url: https://github.com/Nas-r/mhi-rc-ex3-esphome.git
      ref: a90d822d623f1a6fa13ccb0842bcc10ee8d99dda
    # `never` because `ref` is an immutable commit SHA: there is nothing new to
    # fetch, so re-checking only makes every build depend on GitHub being
    # reachable. `refresh: 0s` means "re-fetch every build" and is the right
    # setting only when `ref` is a branch — which it must never be here.
    refresh: never
    components: [rc_ex3]

# ── UART to RC-EX3 panel ─────────────────────────────────────────────────────
uart:
  id: rc_ex3_uart
  rx_pin: GPIO11
  tx_pin: GPIO4
  baud_rate: 38400
  parity: EVEN
  stop_bits: 1
  data_bits: 8

# ── Climate entity ────────────────────────────────────────────────────────────
climate:
  - platform: rc_ex3
    name: "Living Room AC"
    uart_id: rc_ex3_uart
    update_interval: 30sec   # status poll cadence
    # Minutes between diagnostic-data requests; 0 disables them.
    #
    # Disabled deliberately. The request is what puts the panel into
    # "communicating with PC" mode, and the handshake is expensive: the unit
    # answers RSR2 ("not ready") hundreds of times, ~600 frames and ~12 s of
    # saturated bus per attempt. With it running every 2 minutes the device
    # rebooted several times an hour and worst-case loop time was 87–111 ms;
    # with it at 0 the device ran 6.2 h without a reboot at 36 ms.
    #
    # It also has not completed a single successful read since the wiring was
    # fixed, so it currently costs everything and returns nothing. Re-enabling
    # it is what would populate current_temperature and the diagnostic sensors,
    # but that needs the handshake understood first.
    op_data_interval: 0

    # ── Diagnostic sensors (all optional – remove any you don't need) ─────────
    indoor_temperature:
      name: "AC Indoor Temperature"
      id: ac_indoor_temp

    outdoor_temperature:
      name: "AC Outdoor Temperature"
      id: ac_outdoor_temp

    return_air_temperature:
      name: "AC Return Air Temperature"
      id: ac_return_air_temp

    compressor_frequency:
      name: "AC Compressor Frequency"
      id: ac_compressor_hz

    indoor_fan_speed:
      name: "AC Indoor Fan Speed (raw)"
      id: ac_indoor_fan

# ── Health instrumentation ───────────────────────────────────────────────────
# The entity drops to "unavailable" several times an hour and Home Assistant
# logs TimeoutAPIError against port 6053. These answer whether the device is
# rebooting or merely stalling:
#
#   Reset Reason  — a reboot leaves a reason here (panic, watchdog, brownout);
#                   a clean "Power on" after a dropout means it power-cycled.
#   Uptime        — resets across a dropout → reboot. Keeps climbing → stall.
#   Loop Time     — the main loop's worst iteration. A spike toward the API's
#                   10 s timeout points at something blocking the loop.
#   Heap Free     — rules a slow leak in or out.
debug:
  update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"

sensor:
  - platform: uptime
    name: "Uptime"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: debug
    free:
      name: "Heap Free"
    loop_time:
      name: "Loop Time"
