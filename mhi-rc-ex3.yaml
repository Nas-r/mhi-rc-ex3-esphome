# ─────────────────────────────────────────────────────────────────────────────
# MHI RC-EX3 ESPHome Integration
#
# Hardware wiring (4 wires into the RC-EX3 panel through-hole vias):
#   Panel VCC  → ESP32 3.3 V (use a 3.3 V buck converter, NOT a linear reg)
#   Panel GND  → ESP32 GND
#   Panel TX   → ESP32 GPIO11  (UART RX)
#   Panel RX   → ESP32 GPIO4   (UART TX)
#
# Serial parameters: 38400 baud, 8 data bits, Even parity, 1 stop bit (8E1)
# ─────────────────────────────────────────────────────────────────────────────

esphome:
  name: mhi-rc-ex3
  friendly_name: MHI RC-EX3

esp32:
  board: esp32-s2-saola-1
  framework:
    type: arduino

# ── Credentials ──────────────────────────────────────────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "MHI-RC-EX3 Fallback"
    password: !secret ap_password

captive_portal:

# ── Logging ──────────────────────────────────────────────────────────────────
logger:
  # Logging goes out over USB CDC on the S2, so it does not contend with the
  # RC-EX3 UART on GPIO11/GPIO4. Set level to DEBUG while commissioning, then
  # WARN in prod.
  #
  # To read these logs remotely, turn on "Subscribe to logs" in the ESPHome
  # integration's options in Home Assistant AND set the log level for
  # homeassistant.components.esphome to debug — both are required.
  level: DEBUG

# ── Home Assistant API ───────────────────────────────────────────────────────
api:
  encryption:
    key: !secret api_encryption_key

# ── OTA ──────────────────────────────────────────────────────────────────────
ota:
  - platform: esphome
    password: !secret ota_password

# ── Time (for HA clock sync) ─────────────────────────────────────────────────
time:
  - platform: homeassistant
    id: ha_time

# ── External component (fetched from GitHub at compile time) ─────────────────
external_components:
  - source:
      type: git
      url: https://github.com/hump-coder/mhi-rc-ex3-esphome.git
      ref: b1a6b9e6b662ba86f17ab485ea2acee2b8020051
    refresh: 0s
    components: [rc_ex3]

# ── UART to RC-EX3 panel ─────────────────────────────────────────────────────
uart:
  id: rc_ex3_uart
  rx_pin: GPIO11
  tx_pin: GPIO4
  baud_rate: 38400
  parity: EVEN
  stop_bits: 1
  data_bits: 8

# ── Climate entity ────────────────────────────────────────────────────────────
climate:
  - platform: rc_ex3
    name: "Living Room AC"
    uart_id: rc_ex3_uart
    update_interval: 30sec   # status poll cadence
    # Minutes between diagnostic-data requests; 0 disables them (which also
    # prevents the panel's "communicating with PC" mode). NOTE: this is the one
    # value below not confirmed against the deployed config — no request fired
    # during 15 min of observation, which rules out a small value but fits
    # either 100 or 0. Correct it if the running config says 0.
    op_data_interval: 100

    # ── Diagnostic sensors (all optional – remove any you don't need) ─────────
    indoor_temperature:
      name: "AC Indoor Temperature"
      id: ac_indoor_temp

    outdoor_temperature:
      name: "AC Outdoor Temperature"
      id: ac_outdoor_temp

    return_air_temperature:
      name: "AC Return Air Temperature"
      id: ac_return_air_temp

    compressor_frequency:
      name: "AC Compressor Frequency"
      id: ac_compressor_hz

    indoor_fan_speed:
      name: "AC Indoor Fan Speed (raw)"
      id: ac_indoor_fan
